<!doctype html>
<html lang="it">
<head>
<script>
  // Preferenza solo visiva, locale al dispositivo. Nessun saldo viene salvato qui.
  try {
    if (localStorage.getItem('contoapp.hideAmounts.v1') === '1') {
      document.documentElement.classList.add('mask-values');
    }
  } catch (_) { /* Browser con archiviazione privata non disponibile. */ }

  try {
    let accent = localStorage.getItem('contoapp.theme.v1');
    if (!localStorage.getItem('contoapp.auroraIntroduced.v1')) {
      if (!accent || accent === 'blue') {
        accent = 'aurora';
        localStorage.setItem('contoapp.theme.v1', accent);
      }
      localStorage.setItem('contoapp.auroraIntroduced.v1', '1');
    }
    if (['aurora', 'blue', 'violet', 'jade', 'amber', 'crimson'].includes(accent)) {
      document.documentElement.dataset.accent = accent;
    }
  } catch (_) {}
</script>

  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(circle at top,#11213b,#080a10 65%);color:#f5f7fa;font:16px system-ui,-apple-system,Segoe UI,sans-serif}

<body class="page-login">
  <main>
    <img src="icon-192.png" alt="ContoApp">
    <h1>Bentornato in ContoApp</h1>
    <p>Il tuo spazio finanziario personale, protetto dall'accesso Firebase.</p>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="La tua email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="La tua password">
      <label class="password-visibility"><input id="show-password" type="checkbox"> Mostra password</label>
      <button id="submit" type="submit">Accedi in sicurezza</button>
      <div id="error" role="alert" aria-live="polite"></div>
    </form>
    <small>Non inserire mai qui la password di Revolut. Usa solo l'account Firebase di ContoApp.</small>
  </main>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyDTYLxWmpTqJDsbrww39Rk7r72FC40xqkw',
      authDomain: 'conto-corrente.firebaseapp.com',
      databaseURL: 'https://conto-corrente-default-rtdb.europe-west1.firebasedatabase.app',
      projectId: 'conto-corrente',
      appId: '1:138913358347:web:35a016a855be2597989d0e'
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const params = new URLSearchParams(location.search);
    const requested = params.get('next');
    const next = ['index.html', 'analisi.html', 'risparmi.html', 'vinted.html', 'revolut.html', 'viaggi.html', 'info.html'].includes(requested) ? requested : 'index.html';
    const form = document.getElementById('login-form');
    const button = document.getElementById('submit');
    const errorBox = document.getElementById('error');

    onAuthStateChanged(auth, (user) => {
      if (user) location.replace('./' + next);
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      errorBox.textContent = '';
      try {
        await signInWithEmailAndPassword(auth,
          document.getElementById('email').value.trim(),
          document.getElementById('password').value);
        location.replace('./' + next);
      } catch (error) {
        const messages = {
          'auth/invalid-credential': 'Email o password non corretti.',
          'auth/invalid-email': 'Indirizzo email non valido.',
          'auth/too-many-requests': 'Troppi tentativi. Aspetta prima di riprovare.',
          'auth/network-request-failed': 'Connessione non disponibile. Riprova.'
        };
        errorBox.textContent = messages[error.code] || 'Impossibile accedere. Controlla i dati e riprova.';
        button.disabled = false;
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
