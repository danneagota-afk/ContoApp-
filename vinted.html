<script>
  // Preferenza solo visiva, locale al dispositivo. Nessun saldo viene salvato qui.
  try {
    if (localStorage.getItem('contoapp.hideAmounts.v1') === '1') {
      document.documentElement.classList.add('mask-values');
    }
  } catch (_) { /* Browser con archiviazione privata non disponibile. */ }

  try {
    let accent = localStorage.getItem('contoapp.theme.v1');
    if (!localStorage.getItem('contoapp.auroraIntroduced.v1')) {
      if (!accent || accent === 'blue') {
        accent = 'aurora';
        localStorage.setItem('contoapp.theme.v1', accent);
      }
      localStorage.setItem('contoapp.auroraIntroduced.v1', '1');
    }
    if (['aurora', 'blue', 'violet', 'jade', 'amber', 'crimson'].includes(accent)) {
      document.documentElement.dataset.accent = accent;
    }
  } catch (_) {}
</script>

  <style>
    :root { 
      --bg: #000000; --card: #0a0a0a; --text: #ffffff; 
      --muted: #888888; --blue: #3b82f6; --danger: #ff3333; --success: #22c55e;
      --vinted: #008f95;
    }
    * { box-sizing: border-box; font-family: 'Outfit', sans-serif; }
    
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    body { margin: 0; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 0 20px 30px 20px; min-height: 100vh; }
    
    .navbar { width: 100%; max-width: 1100px; display: flex; justify-content: center; gap: 30px; padding: 30px 0; border-bottom: 1px solid #222; margin-bottom: 20px; }
    .navbar a { color: var(--muted); text-decoration: none; font-weight: 600; transition: 0.2s; }
    .navbar a:hover { color: var(--text); }
    .navbar a.active { color: white; }

    .container { width: 100%; max-width: 1100px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-top: 20px; }
    
    .box { background: var(--card); border: 1px solid #151515; padding: 25px; border-radius: 30px; display: flex; flex-direction: column; }
    h2 { margin: 0 0 15px 0; font-weight: 800; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; }
    
    .total-mini { 
      font-size: 1.2rem; 
      color: var(--text); 
      font-weight: 800; 
      background: rgba(255,255,255,0.05);
      padding: 5px 12px;
      border-radius: 10px;
    }

    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #222; background: #111; color: white; outline: none; font-size: 1rem; }
    input:focus { border-color: var(--vinted); }
    
    .btn-add { padding: 12px 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
    .btn-in { background: var(--vinted); }
    .btn-out { background: var(--danger); }
    .btn-add:hover { opacity: 0.8; transform: scale(1.02); }

    .list { height: 400px; overflow-y: auto; padding-right: 5px; }
    .item { background: #111; padding: 15px; border-radius: 15px; margin-bottom: 10px; border-left: 4px solid #333; display: flex; justify-content: space-between; align-items: center; animation: slideIn 0.3s ease-out; }
    .item.in { border-left-color: var(--success); }
    .item.out { border-left-color: var(--danger); }
    
    .item-info b { display: block; font-size: 1.1rem; }
    .item-info span { font-size: 0.75rem; color: var(--muted); }

    .btn-reset { margin-top: 40px; background: none; border: 1px solid #222; color: #444; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
    .btn-reset:hover { border-color: var(--danger); color: var(--danger); }

    @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
    @media (max-width: 800px) { .container { grid-template-columns: 1fr; } }
  </style>

<header class="page-header">
    <div class="eyebrow">REGISTRO ATTIVITÀ</div>
    <h1>La tua attività <span>Vinted.</span></h1>
    <p>Registra incassi e spese, senza confonderli con i movimenti bancari.</p>
  </header>

  <div class="container">
    <div class="box">
      <h2 style="color: var(--vinted);">Entrate <span class="total-mini" id="tot-in">€ 0.00</span></h2>
      <div class="input-group">
        <input type="number" id="input-in" placeholder="Importo incassato €" step="0.01">
        <button class="btn-add btn-in" id="btn-add-in">Aggiungi</button>
      </div>
      <div class="list" id="lista-in"></div>
    </div>

    <div class="box">
      <h2 style="color: var(--danger);">Uscite <span class="total-mini" id="tot-out">€ 0.00</span></h2>
      <div class="input-group">
        <input type="number" id="input-out" placeholder="Importo speso €" step="0.01">
        <button class="btn-add btn-out" id="btn-add-out">Aggiungi</button>
      </div>
      <div class="list" id="lista-out"></div>
    </div>
  </div>

  <button class="btn-reset" id="btn-reset">Elimina la cronologia Vinted</button>

  <script type="module">
    import { requireAuth } from "./auth-guard.js?v=20261013-viaggi-analisi-2";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTYLxWmpTqJDsbrww39Rk7r72FC40xqkw",
      authDomain: "conto-corrente.firebaseapp.com",
      databaseURL: "https://conto-corrente-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "conto-corrente",
      storageBucket: "conto-corrente.firebasestorage.app",
      messagingSenderId: "138913358347",
      appId: "1:138913358347:web:35a016a855be2597989d0e"
    };

    const app = initializeApp(firebaseConfig);
    const accessGate = await requireAuth(app);
    const db = getDatabase(app);
    const vintedRef = ref(db, 'vinted_data');

    let datiVinted = { entrate: [], uscite: [] };

    // --- CARICAMENTO DATI ---
    onValue(vintedRef, (snapshot) => {
      const data = snapshot.val();
      accessGate.ready();
      if (data) {
        datiVinted = {
            entrate: Array.isArray(data.entrate) ? data.entrate : [],
            uscite: Array.isArray(data.uscite) ? data.uscite : []
        };
      } else {
        datiVinted = { entrate: [], uscite: [] };
      }
      renderizzaListe();
    }, (error) => accessGate.error(error));

    // --- FUNZIONE AGGIUNGI ---
    // Transaction avoids double submission and racing edits from another device.
    let vintedBusy = false;
    window.aggiungi = async function(tipo) {
      if (vintedBusy || !['in','out'].includes(tipo)) return;
      const input = document.getElementById(`input-${tipo}`);
      const valore = Number(input.value);
      if (!Number.isFinite(valore) || valore <= 0 || valore > 10000000 ||
          Math.abs(Math.round(valore * 100) - valore * 100) > 1e-7) {
        alert('Inserisci un importo valido, massimo due decimali.');
        return;
      }
      const cleaned = Math.round(valore * 100) / 100;
      const ora = new Date();
      const date = ora.toLocaleDateString('it-IT') + ' ' + ora.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      const tx = {valore:cleaned,data:date};
      vintedBusy = true;
      const buttons = [document.getElementById('btn-add-in'),document.getElementById('btn-add-out')];
      buttons.forEach(button => button.disabled = true);
      try {
        const result = await runTransaction(vintedRef, current => {
          const data = current && typeof current === 'object' ? current : {};
          const entrate = Array.isArray(data.entrate) ? data.entrate.slice() : [];
          const uscite = Array.isArray(data.uscite) ? data.uscite.slice() : [];
          if (tipo === 'out') {
            const incoming = entrate.reduce((acc,t)=>acc+(Number(t?.valore)||0),0);
            const outgoing = uscite.reduce((acc,t)=>acc+(Number(t?.valore)||0),0);
            if (cleaned > Math.round((incoming-outgoing)*100)/100) return;
            uscite.push(tx);
          } else entrate.push(tx);
          return {...data,entrate,uscite};
        },{applyLocally:false});
        if (!result.committed) {
          alert('Fondi Vinted insufficienti o dati cambiati. Riprova dopo averli aggiornati.');
          return;
        }
        input.value = '';
      } catch (error) {
        console.error('VINTED_SAVE',error?.code||'network');
        alert('Salvataggio non riuscito. Controlla la connessione e riprova.');
      } finally {
        vintedBusy = false;
        buttons.forEach(button=>button.disabled = false);
      }
    };

    // --- RENDER ---
    function renderizzaListe() {
      // Older Firebase records may contain strings. Always sum numeric cents.
      const money = n => new Intl.NumberFormat('it-IT', {style:'currency',currency:'EUR'}).format(n);
      const renderGroup = (containerId, records, outgoing) => {
        const container = document.getElementById(containerId);
        container.replaceChildren();
        let total = 0;
        for (const tx of records) {
          const value = Number(tx?.valore);
          if (!Number.isFinite(value) || value < 0) continue;
          total += value;
          const item = document.createElement('div');
          item.className = `item ${outgoing ? 'out' : 'in'}`;
          const info = document.createElement('div');
          info.className = 'item-info';
          const amount = document.createElement('b');
          amount.textContent = `${outgoing ? '− ' : '+ '}${money(value)}`;
          const date = document.createElement('span');
          date.textContent = String(tx.data || 'Data non disponibile');
          info.append(amount, date);
          item.append(info);
          container.prepend(item);
        }
        if (!container.childElementCount) {
          const empty = document.createElement('p');
          empty.className = 'empty-movements';
          empty.textContent = outgoing ? 'Nessuna uscita Vinted.' : 'Nessuna entrata Vinted.';
          container.append(empty);
        }
        return Math.round(total * 100) / 100;
      };
      const entrate = renderGroup('lista-in', datiVinted.entrate, false);
      const uscite = renderGroup('lista-out', datiVinted.uscite, true);
      document.getElementById('tot-in').textContent = money(entrate);
      document.getElementById('tot-out').textContent = money(uscite);
    }

    // --- RESET ---
    window.resetVinted = async function() {
      if (vintedBusy) return;
      if (!confirm('Vuoi eliminare definitivamente tutte le entrate e uscite Vinted?')) return;
      if (prompt('Per confermare, scrivi ELIMINA in maiuscolo:') !== 'ELIMINA') return;
      vintedBusy = true;
      const button = document.getElementById('btn-reset');
      button.disabled = true;
      try { await set(vintedRef, {entrate:[],uscite:[]}); }
      catch (error) { console.error('VINTED_RESET',error?.code||'network'); alert('Cancellazione non riuscita. I dati non sono stati eliminati dal server.'); }
      finally { button.disabled=false; vintedBusy=false; }
    }

    // Aggancio eventi ai bottoni
    document.getElementById('btn-add-in').onclick = () => window.aggiungi('in');
    document.getElementById('btn-add-out').onclick = () => window.aggiungi('out');
    document.getElementById('btn-reset').onclick = () => window.resetVinted();

  </script>
